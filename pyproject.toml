[project]
name = "slack-knowledge-curator"
version = "0.1.0"
description = "Export a personal Slack channel, enrich + classify it with Claude, and build a Cognee knowledge graph (pgGraph showcase)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Marvin Scaff", email = "marvin@sylogic.ai" }]
dependencies = [
    "slack-sdk>=3.27",
    "anthropic>=0.40",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# The graph stage. Kept optional so `ingest`/`enrich`/`classify` run without a
# heavy Cognee install. Mirrors the cognee-community pgGraph adapter's deps.
graph = [
    "cognee>=1.1.1,<2",  # audited against v1.1.1 (released 2026-05-29); see docs/DEVLOG.md
    "asyncpg>=0.29",
    "cognee-community-graph-adapter-pggraph>=0.1.0",
]

[project.scripts]
skc = "skc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skc"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
