# Local Postgres for the Cognee graph stage.
#
# Uses the pgvector image so Cognee's vector adapter (pgvector) and graph tables
# (graph_node / graph_edge) share one database. Port 5433 avoids any local
# Postgres on 5432 — matches the cognee-community pgGraph adapter defaults.
#
# NOTE: this image does NOT ship the pgGraph `graph` C extension, so the
# pgGraph adapter runs in its recursive-CTE SQL-fallback mode (correct results,
# no traversal acceleration). To exercise the real extension you need a Postgres
# image with pgGraph compiled in — see docs/cognee-postgres-vs-pggraph.md.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: skc-postgres
    environment:
      POSTGRES_USER: cognee
      POSTGRES_PASSWORD: cognee
      POSTGRES_DB: cognee
    # 5434 keeps us clear of any other local Postgres (incl. a stock pgGraph
    # demo container) already bound to 5433. Matches .env's *_PORT=5434.
    ports:
      - "5434:5432"
    volumes:
      - skc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognee -d cognee"]
      interval: 3s
      timeout: 5s
      retries: 15

volumes:
  skc_pgdata:
